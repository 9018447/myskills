schema_version: "1.0"
workflow:
  id: ticket-status-audit
  name: Ticket Status Audit
  version: "1.0.0"
steps:
  - id: preflight
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" preflight'
  - id: execute
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" execute'
  - id: verify-first
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" verify'
    continue_on_error: true
  - id: repair-if-fixable
    type: if
    condition: "{{ steps.verify-first.output.exit_code == 1 }}"
    then:
      - id: repair
        type: shell
        run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" repair'
      - id: verify-again
        type: shell
        run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" verify'
  - id: deep-dive
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" deepdive'
  - id: verify-final
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" verify'
  - id: final-check
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" assert-passed'
  - id: finalize
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" finalize'
