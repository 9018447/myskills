# 仅作 Workflow Schema 结构参考；不能直接运行生产任务。
# 使用 /create-workflow 时按目标项目生成真实 YAML，并准备/审核所有引用的脚本。
schema_version: "1.0"
workflow:
  id: luna-worker
  name: Verified Codex Worker
  version: "1.0.0"
steps:
  - id: preflight
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" preflight'
  - id: execute
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" execute'
  - id: verify-first
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" verify'
    continue_on_error: true
  - id: repair-if-fixable
    type: if
    condition: "{{ steps.verify-first.output.exit_code == 1 }}"
    then:
      - id: repair
        type: shell
        run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" repair'
      - id: verify-again
        type: shell
        run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" verify'
  - id: final-check
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" assert-passed'
  - id: finalize
    type: shell
    run: 'python3 "$SPECKIT_WORKFLOW_DIR/scripts/driver.py" finalize'
# driver.py 应约定：verify 退出码 0=通过，1=可修复失败，其余=致命失败；
# final-check 强制检查最终报告，避免 continue_on_error 掩盖首次失败。
